<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#43a047">
<meta name="description" content="英语乐园 — 面向深圳小学1-2年级的英语互动学习网页应用，基于沪教版（牛津深圳版）教材">
<title>🦁 英语乐园 · 小学英语互动学习</title>
<style>
/* ==========================================================
   CSS Reset & Base
   ========================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  background:linear-gradient(135deg,#e8f5e9 0%,#fff3e0 50%,#e3f2fd 100%);
  color:#333;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  user-select:none;
  -webkit-user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
button:focus-visible{outline:3px solid #43a047;outline-offset:2px}
input,textarea{font-family:inherit;font-size:inherit}
img{max-width:100%;display:block}

/* ==========================================================
   Color tokens (use in modules)
   ========================================================== */
:root{
  --c-green-1:#2e7d32;--c-green-2:#43a047;--c-green-3:#e8f5e9;
  --c-orange-1:#e65100;--c-orange-2:#ff6f00;--c-orange-3:#fff3e0;
  --c-blue-1:#1565c0;--c-blue-2:#e3f2fd;
  --c-purple-1:#7b1fa2;--c-purple-2:#f3e5f5;
  --c-red-1:#c62828;--c-red-2:#ffcdd2;
  --c-ok:#43a047;--c-ok-bg:#c8e6c9;
  --c-err:#c62828;--c-err-bg:#ffcdd2;
  --c-star:#ffd700;
  --shadow-card:0 2px 12px rgba(0,0,0,.08);
  --shadow-nav:0 2px 8px rgba(0,0,0,.15);
  --r-card:16px;--r-btn:12px;--r-pill:20px;--r-cell:10px;
}

/* ==========================================================
   Top Navigation
   ========================================================== */
.top-nav{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(135deg,var(--c-green-2),#66bb6a);
  color:#fff;
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-nav);
}
.top-nav .logo{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px;letter-spacing:.5px}
.top-nav .logo .lion{font-size:26px}
.star-counter{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.22);
  padding:6px 14px;border-radius:var(--r-pill);
  font-size:16px;font-weight:700;
  backdrop-filter:blur(8px);
}
.star-counter .star-icon{color:var(--c-star);font-size:20px}

/* ==========================================================
   Module Nav (5 columns)
   ========================================================== */
.module-nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  padding:12px 16px;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(10px);
  position:sticky;top:62px;z-index:99;
  border-bottom:1px solid rgba(0,0,0,.04);
}
.module-btn{
  padding:10px 4px;
  border-radius:var(--r-btn);
  background:#fff;
  font-size:13px;font-weight:600;
  color:#555;
  transition:transform .2s,background .2s,color .2s;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-height:52px;
}
.module-btn .ico{font-size:20px;line-height:1}
.module-btn:hover{transform:scale(1.05)}
.module-btn.active{
  background:linear-gradient(135deg,var(--c-green-2),#66bb6a);
  color:#fff;transform:scale(1.05);
  box-shadow:0 4px 12px rgba(67,160,71,.3);
}

/* ==========================================================
   Content Area
   ========================================================== */
.content{
  max-width:800px;margin:0 auto;
  padding:16px;
  padding-bottom:80px;
}
.module-panel{display:none;animation:fadeIn .3s ease}
.module-panel.active{display:block}

/* ==========================================================
   Card primitives
   ========================================================== */
.card{
  background:#fff;border-radius:var(--r-card);
  padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow-card);
}
.card-title{
  font-size:18px;font-weight:700;margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.card-title .accent{display:inline-block;width:4px;height:18px;background:var(--c-green-2);border-radius:2px}

/* ==========================================================
   Buttons
   ========================================================== */
.btn{
  padding:10px 18px;border-radius:var(--r-btn);
  background:var(--c-green-2);color:#fff;font-weight:600;
  transition:transform .15s,filter .15s,opacity .15s;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{transform:scale(1.05)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.orange{background:var(--c-orange-2)}
.btn.blue{background:var(--c-blue-1)}
.btn.purple{background:var(--c-purple-1)}
.btn.red{background:var(--c-red-1)}
.btn.ghost{background:#fff;color:#333;border:2px solid #eee}
.btn.ghost:hover{border-color:var(--c-green-2);color:var(--c-green-2)}

.icon-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--c-orange-3);color:var(--c-orange-1);
  font-size:20px;display:inline-flex;align-items:center;justify-content:center;
  transition:transform .15s,background .15s;
}
.icon-btn:hover{transform:scale(1.1);background:#ffe0b2}
.icon-btn:active{transform:scale(.95)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}

/* ==========================================================
   Tabs (pill)
   ========================================================== */
.tab-row{
  display:flex;gap:8px;overflow-x:auto;
  padding:4px 2px 12px;
  scrollbar-width:none;
}
.tab-row::-webkit-scrollbar{display:none}
.tab-pill{
  padding:8px 16px;border-radius:var(--r-pill);
  background:#fff;color:#555;font-weight:600;font-size:13px;
  white-space:nowrap;border:2px solid transparent;
  transition:all .2s;min-height:36px;
}
.tab-pill:hover{transform:scale(1.05)}
.tab-pill.active{background:var(--c-green-2);color:#fff;border-color:var(--c-green-2)}
.tab-pill.orange.active{background:var(--c-orange-2);border-color:var(--c-orange-2)}
.tab-pill.blue.active{background:var(--c-blue-1);border-color:var(--c-blue-1)}
.tab-pill.purple.active{background:var(--c-purple-1);border-color:var(--c-purple-1)}
.tab-pill.red.active{background:var(--c-red-1);border-color:var(--c-red-1)}

.subgame-tabs{
  display:flex;gap:8px;margin-bottom:14px;
}
.subgame-tabs .tab-pill{flex:1;text-align:center}

/* ==========================================================
   Module 1: Alphabet
   ========================================================== */
.alphabet-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
  margin-bottom:14px;
}
.letter-cell{
  aspect-ratio:1;border-radius:var(--r-cell);
  background:var(--c-green-3);color:var(--c-green-1);
  font-weight:700;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;cursor:pointer;
  border:2px solid transparent;
}
.letter-cell:hover{transform:scale(1.08);border-color:var(--c-green-2)}
.letter-cell.active{background:var(--c-green-2);color:#fff;transform:scale(1.15);box-shadow:0 4px 12px rgba(67,160,71,.4)}

.letter-detail{
  background:linear-gradient(135deg,#fff,#f1f8e9);
  border-radius:var(--r-card);padding:20px;
  display:flex;align-items:center;gap:18px;
  box-shadow:var(--shadow-card);
  animation:popIn .3s ease;
}
.letter-detail .big-letter{font-size:84px;font-weight:900;color:var(--c-green-1);line-height:1;min-width:140px;text-align:center}
.letter-detail .big-letter .lower{display:block;font-size:42px;color:var(--c-green-2);margin-top:4px}
.letter-detail .info{flex:1}
.letter-detail .word{font-size:24px;font-weight:700;margin-bottom:4px}
.letter-detail .cn{color:#666;font-size:15px;margin-bottom:8px}
.letter-detail .emoji-big{font-size:56px;display:block;margin-bottom:6px}

.nav-row{display:flex;gap:8px;margin-top:12px}

/* ==========================================================
   Module 2: Words
   ========================================================== */
.word-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.word-card{
  background:var(--c-orange-3);border-radius:var(--r-card);
  padding:12px;text-align:center;cursor:pointer;
  transition:all .2s;border:2px solid transparent;
}
.word-card:hover{transform:scale(1.05);border-color:var(--c-orange-2)}
.word-card.active{background:#fff;border-color:var(--c-orange-2);box-shadow:0 4px 12px rgba(255,111,0,.2)}
.word-card .emoji{font-size:36px;display:block;margin-bottom:4px}
.word-card .en{font-weight:700;color:var(--c-orange-1);font-size:15px}
.word-card .cn{color:#888;font-size:12px;margin-top:2px}

.word-detail-card{
  background:#fff;border-radius:var(--r-card);padding:20px;
  box-shadow:var(--shadow-card);
  display:flex;align-items:center;gap:16px;
  animation:popIn .3s ease;
}
.word-detail-card .emoji-big{font-size:80px}
.word-detail-card .info{flex:1}
.word-detail-card .en{font-size:26px;font-weight:700;color:var(--c-orange-1)}
.word-detail-card .cn{color:#666;font-size:15px;margin:4px 0}
.word-detail-card .phonetic{color:#999;font-size:14px;font-style:italic}

.mark-learned-btn{
  margin-top:10px;padding:6px 14px;border-radius:var(--r-pill);
  background:var(--c-orange-2);color:#fff;font-weight:600;font-size:13px;
  transition:all .2s;
}
.mark-learned-btn.learned{background:var(--c-ok)}
.mark-learned-btn:hover{transform:scale(1.05)}

/* ==========================================================
   Module 3: Sentences
   ========================================================== */
.sentence-list{display:flex;flex-direction:column;gap:10px}
.sentence-item{
  background:#fff;border-radius:var(--r-card);padding:14px;
  box-shadow:var(--shadow-card);
  display:flex;align-items:center;gap:12px;
}
.sentence-item .text{flex:1}
.sentence-item .en{font-size:17px;font-weight:600;color:var(--c-blue-1);margin-bottom:2px}
.sentence-item .cn{color:#666;font-size:14px}

/* ==========================================================
   Module 4: Listening
   ========================================================== */
.listen-area{text-align:center}
.listen-target{
  font-size:48px;margin:18px 0;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.listen-target .emoji{font-size:64px}
.listen-target .big-speaker{
  font-size:42px;cursor:pointer;
  width:80px;height:80px;border-radius:50%;
  background:var(--c-purple-2);color:var(--c-purple-1);
  display:inline-flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.listen-target .big-speaker:hover{transform:scale(1.1);background:#e1bee7}
.listen-target .big-speaker.playing{animation:pulse .8s infinite}

.listen-options{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  margin-top:14px;
}
.listen-option{
  background:#fff;border:2px solid #eee;border-radius:var(--r-card);
  padding:14px;font-size:16px;font-weight:600;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:8px;justify-content:center;
  min-height:60px;
}
.listen-option:hover:not(:disabled){transform:scale(1.05);border-color:var(--c-purple-1)}
.listen-option.correct{background:var(--c-ok-bg);border-color:var(--c-ok);color:var(--c-ok)}
.listen-option.wrong{background:var(--c-err-bg);border-color:var(--c-err);color:var(--c-err);animation:shake .4s}
.listen-option:disabled{cursor:not-allowed}

/* ==========================================================
   Module 5: Games
   ========================================================== */

/* Memory */
.memory-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-top:12px;
}
.memory-card{
  aspect-ratio:1;border-radius:var(--r-cell);
  background:linear-gradient(135deg,var(--c-purple-1),#ba68c8);
  color:#fff;font-size:28px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .3s;
  position:relative;
  font-weight:700;
}
.memory-card .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:4px;backface-visibility:hidden;border-radius:var(--r-cell);text-align:center;font-size:14px;line-height:1.2}
.memory-card .face.back{background:linear-gradient(135deg,var(--c-purple-1),#ba68c8);transform:rotateY(0)}
.memory-card .face.front{background:#fff;color:#333;transform:rotateY(180deg);font-size:13px;overflow:hidden}
.memory-card.flipped{transform:rotateY(180deg)}
.memory-card.matched{background:var(--c-ok-bg);color:var(--c-ok);transform:scale(.95)}
.memory-card.matched .face.back{background:var(--c-ok-bg);color:var(--c-ok)}

/* Whack */
.whack-area{text-align:center}
.whack-hud{
  display:flex;justify-content:space-around;align-items:center;
  background:var(--c-red-2);padding:12px;border-radius:var(--r-card);margin-bottom:14px;
  font-weight:700;
}
.whack-hud .label{font-size:13px;color:#666;font-weight:500}
.whack-hud .value{font-size:24px;color:var(--c-red-1)}
.whack-target-word{
  background:#fff;border:2px dashed var(--c-red-1);
  padding:10px 18px;border-radius:var(--r-pill);
  display:inline-flex;align-items:center;gap:8px;
  font-size:22px;font-weight:700;color:var(--c-red-1);
  margin-bottom:12px;
}
.whack-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  max-width:420px;margin:0 auto;
}
.whack-hole{
  aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#8d6e63 0%,#5d4037 100%);
  position:relative;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;min-height:90px;
  transition:transform .1s;
}
.whack-hole:active{transform:scale(.95)}
.whack-hole .mole{
  position:absolute;bottom:0;
  background:#fff;border-radius:12px 12px 0 0;
  padding:8px 4px 4px;font-weight:700;font-size:18px;color:var(--c-red-1);
  width:90%;text-align:center;
  transition:transform .2s,opacity .2s;
  transform:translateY(100%);opacity:0;
}
.whack-hole.show .mole{transform:translateY(15%);opacity:1}
.whack-hole.show.correct-hit{background:radial-gradient(circle,#81c784,#43a047)}
.whack-hole.show.wrong-hit{background:radial-gradient(circle,#e57373,#c62828)}

/* Challenge */
.challenge-hud{
  display:flex;justify-content:space-around;align-items:center;
  background:#fff;padding:12px;border-radius:var(--r-card);
  margin-bottom:14px;font-weight:700;box-shadow:var(--shadow-card);
}
.challenge-hud .timer{font-size:28px;color:var(--c-red-1);min-width:60px}
.challenge-hud .timer.urgent{animation:pulse .5s infinite;color:#d32f2f}
.challenge-result{
  text-align:center;padding:24px;
  background:linear-gradient(135deg,#fff,#fff8e1);
  border-radius:var(--r-card);box-shadow:var(--shadow-card);
  animation:popIn .4s;
}
.challenge-result .big-score{font-size:56px;font-weight:900;color:var(--c-orange-1);margin:8px 0}
.challenge-result .stars-row{font-size:32px;margin:8px 0;color:var(--c-star);letter-spacing:4px}
.challenge-result .stats{display:flex;justify-content:space-around;margin:14px 0;font-size:15px;color:#666}

/* Generic match/grid (used by letter match & word match) */
.match-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.match-card{
  aspect-ratio:1;border-radius:var(--r-cell);
  background:#fff;border:2px solid #eee;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:18px;cursor:pointer;
  transition:all .2s;
}
.match-card:hover:not(:disabled){transform:scale(1.05);border-color:var(--c-green-2)}
.match-card.selected{border-color:var(--c-green-2);background:var(--c-green-3);color:var(--c-green-1)}
.match-card.matched{background:var(--c-ok-bg);border-color:var(--c-ok);color:var(--c-ok);cursor:default}
.match-card:disabled{cursor:not-allowed}

/* Letter order slots */
.order-slots{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:12px;background:var(--c-green-3);
  border-radius:var(--r-card);min-height:60px;
  margin-bottom:10px;
}
.order-slot{
  width:42px;height:42px;border-radius:var(--r-cell);
  background:#fff;border:2px dashed #bbb;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:20px;color:var(--c-green-1);
}
.order-slot.filled{border-style:solid;border-color:var(--c-green-2)}
.order-bank{
  display:flex;gap:6px;flex-wrap:wrap;
  padding:12px;background:#fff;border-radius:var(--r-card);
}
.order-piece{
  width:42px;height:42px;border-radius:var(--r-cell);
  background:var(--c-green-2);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:20px;cursor:pointer;
  transition:all .15s;
}
.order-piece:hover{transform:scale(1.1)}
.order-piece:disabled{opacity:.3;cursor:not-allowed;transform:none}

/* Letter find grid */
.find-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-width:360px;margin:12px auto;
}
.find-cell{
  aspect-ratio:1;border-radius:var(--r-cell);
  background:#fff;border:2px solid #eee;
  font-size:24px;font-weight:700;color:var(--c-green-1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.find-cell:hover:not(:disabled){transform:scale(1.08);border-color:var(--c-green-2)}
.find-cell.correct{background:var(--c-ok-bg);border-color:var(--c-ok)}
.find-cell.wrong{background:var(--c-err-bg);border-color:var(--c-err);animation:shake .4s}
.find-cell:disabled{cursor:not-allowed}

.find-target{
  text-align:center;margin-bottom:8px;
  font-size:18px;color:#666;
}
.find-target .target-letter{
  display:inline-block;font-size:36px;font-weight:900;
  color:var(--c-green-1);background:var(--c-green-3);
  padding:4px 16px;border-radius:var(--r-pill);margin-left:6px;
}

/* Spell game */
.spell-display{
  text-align:center;padding:18px;
  background:var(--c-orange-3);border-radius:var(--r-card);
  margin-bottom:12px;
}
.spell-display .emoji{font-size:64px;display:block}
.spell-display .cn{color:#666;font-size:16px;margin-top:4px}
.spell-slots{
  display:flex;gap:4px;justify-content:center;flex-wrap:wrap;
  padding:14px;background:#fff;border-radius:var(--r-card);
  min-height:54px;margin-bottom:12px;border:2px solid #eee;
}
.spell-slot{
  width:38px;height:42px;border-radius:8px;
  background:#fff;border:2px solid #ddd;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:20px;color:var(--c-orange-1);
}
.spell-slot.filled{border-color:var(--c-orange-2);background:#fff3e0}
.spell-keyboard{
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
  padding:12px;background:#f5f5f5;border-radius:var(--r-card);
}
.spell-key{
  width:38px;height:42px;border-radius:8px;
  background:#fff;border:2px solid #eee;
  font-weight:700;font-size:18px;color:#333;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
}
.spell-key:hover:not(:disabled){transform:scale(1.1);border-color:var(--c-orange-2);background:var(--c-orange-3)}
.spell-key:disabled{opacity:.25;cursor:not-allowed;transform:none}

.spell-clear{
  width:auto;padding:0 14px;font-size:14px;
  background:#eee;color:#666;
}

/* Sentence order: uses slots + bank similar to letter order */

/* Game-over screen */
.game-over{
  text-align:center;padding:24px;
  background:linear-gradient(135deg,#fff8e1,#fff);
  border-radius:var(--r-card);box-shadow:var(--shadow-card);
  animation:popIn .4s;
}
.game-over h3{font-size:22px;margin-bottom:8px;color:var(--c-orange-1)}
.game-over .stats{display:flex;justify-content:space-around;margin:14px 0;font-size:15px;color:#666}
.game-over .score{font-size:36px;font-weight:900;color:var(--c-green-2);margin:6px 0}

/* ==========================================================
   Toast
   ========================================================== */
.toast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  padding:14px 24px;border-radius:var(--r-btn);
  background:rgba(0,0,0,.85);color:#fff;font-weight:600;font-size:16px;
  z-index:9999;animation:popIn .25s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  max-width:80vw;text-align:center;
}
.toast.success{background:var(--c-ok)}
.toast.error{background:var(--c-err)}

/* ==========================================================
   Confetti
   ========================================================== */
#confettiContainer{position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden}
.confetti-piece{
  position:absolute;top:-20px;
  width:10px;height:14px;
  animation:confettiFall 3s linear forwards;
}

/* ==========================================================
   Animations
   ========================================================== */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes confettiFall{
  from{transform:translateY(-10px) rotate(0);opacity:1}
  to{transform:translateY(100vh) rotate(720deg);opacity:0}
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

// Localstorage safe wrappers
function _lsGet(key, fallback){
  try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
  catch(e){ console.warn('localStorage read failed:', e); return fallback; }
}
function _lsSet(key, value){
  try { localStorage.setItem(key, value); }
  catch(e){ console.warn('localStorage write failed:', e); }
}

// Random helpers
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ==========================================================
   Voice system (Web Speech API)
   ========================================================== */
function pickFemaleVoice(){
  if(_cachedFemaleVoice) return _cachedFemaleVoice;
  if(!('speechSynthesis' in window)) return null;

  const voices = window.speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return null;

  // Level 1: exact match known female names
  const femaleNames = [
    'Samantha','Karen','Moira','Tessa','Fiona','Victoria','Allison',
    'Google US English','Google UK English Female','Google 普通话',
    'Zira','Hoda','Hazel','Aria','Jenny','Microsoft Aria Online',
    'Alice','Julie','Amy','Emma','Susan','Kate'
  ];
  for(const name of femaleNames){
    const v = voices.find(v => v.name === name);
    if(v){ _cachedFemaleVoice = v; return v; }
  }
  // Level 2: includes
  for(const name of femaleNames){
    const v = voices.find(v => v.name.includes(name));
    if(v){ _cachedFemaleVoice = v; return v; }
  }
  // Level 3: female / woman keyword
  const v3 = voices.find(v =>
    /female|woman|girl/i.test(v.name) && !/male|man|boy/i.test(v.name)
  );
  if(v3){ _cachedFemaleVoice = v3; return v3; }
  // Level 4: exclude known males
  const maleNames = ['Daniel','Alex','Fred','Tom','Google UK English Male','David','Mark','Microsoft Guy'];
  const enVoices = voices.filter(v => v.lang && v.lang.startsWith('en'));
  const v4 = enVoices.find(v => !maleNames.some(m => v.name.includes(m)));
  if(v4){ _cachedFemaleVoice = v4; return v4; }
  // Fallback
  const fallback = enVoices[0] || voices[0];
  if(fallback){ _cachedFemaleVoice = fallback; }
  return fallback;
}

function speak(text, lang){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'en-US';
    u.rate = 0.75;
    u.pitch = 1.3;
    u.volume = 1.0;
    const v = pickFemaleVoice();
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){
    console.warn('speak failed:', e);
  }
}

if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = function(){
    _cachedFemaleVoice = null;
    pickFemaleVoice();
    _voicesLoaded = true;
  };
}

/* ==========================================================
   Audio system (Web Audio API)
   ========================================================== */
function _getAudioCtx(){
  if(_audioCtx) return _audioCtx;
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    _audioCtx = new Ctx();
    return _audioCtx;
  }catch(e){
    console.warn('AudioContext failed:', e);
    return null;
  }
}
function playCorrectSound(){
  const ctx = _getAudioCtx(); if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const t = ctx.currentTime;
    osc.frequency.setValueAtTime(523, t);
    osc.frequency.setValueAtTime(659, t + 0.1);
    osc.frequency.setValueAtTime(784, t + 0.2);
    osc.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.3);
  }catch(e){ console.warn('correct sound failed:', e); }
}
function playWrongSound(){
  const ctx = _getAudioCtx(); if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    const t = ctx.currentTime;
    osc.frequency.setValueAtTime(200, t);
    osc.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.3);
  }catch(e){ console.warn('wrong sound failed:', e); }
}
function playClickSound(){
  const ctx = _getAudioCtx(); if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    const t = ctx.currentTime;
    osc.frequency.setValueAtTime(800, t);
    osc.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.05);
  }catch(e){ /* click is non-critical */ }
}

function startLetterMatch(){
  letterMatchData = [];
  letterMatchSelected = null;
  letterMatchScore = 0;
  // pick 6 letters randomly
  const pool = shuffle(LETTERS).slice(0, 6);
  const cards = [];
  pool.forEach(L => {
    cards.push({ id: L.upper + '_U', letter: L.upper, kind: 'upper', match: L.lower });
    cards.push({ id: L.lower + '_L', letter: L.lower, kind: 'lower', match: L.upper });
  });
  letterMatchData = shuffle(cards);
  renderLetterMatch();
}
function renderLetterMatch(){
  const area = document.getElementById('letterGameArea');
  area.innerHTML = `
    <div style="text-align:center;margin-bottom:10px;color:#666;font-size:14px">点击大写字母和小写字母配对（已配对 ${letterMatchScore} / 6）</div>
    <div class="match-grid" id="letterMatchGrid"></div>`;
  const grid = document.getElementById('letterMatchGrid');
  letterMatchData.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'match-card';
    div.textContent = c.letter;
    div.dataset.idx = idx;
    div.setAttribute('aria-label', `字母 ${c.letter}`);
    div.addEventListener('click', () => handleLetterMatchClick(idx));
    grid.appendChild(div);
  });
}
function handleLetterMatchClick(idx){
  playClickSound();
  const card = letterMatchData[idx];
  if(card.matched) return;
  const el = document.querySelector(`#letterMatchGrid .match-card[data-idx="${idx}"]`);
  if(!el) return;
  if(letterMatchSelected === null){
    letterMatchSelected = idx;
    el.classList.add('selected');
    return;
  }
  if(letterMatchSelected === idx){
    el.classList.remove('selected');
    letterMatchSelected = null;
    return;
  }
  const other = letterMatchData[letterMatchSelected];
  const otherEl = document.querySelector(`#letterMatchGrid .match-card[data-idx="${letterMatchSelected}"]`);
  // check match: upper.lower === other.upper
  const isMatch =
    (card.kind === 'upper' && other.kind === 'lower' && card.letter === other.match) ||
    (card.kind === 'lower' && other.kind === 'upper' && card.letter === other.match);
  if(isMatch){
    card.matched = true;
    other.matched = true;
    el.classList.add('matched');
    otherEl.classList.add('matched');
    el.disabled = true; otherEl.disabled = true;
    letterMatchScore += 1;
    playCorrectSound();
    addStars(1);
    showToast('配对成功！+1⭐', 'success');
    speak('Great!', 'en-US');
    if(letterMatchScore >= 6){
      setTimeout(() => {
        showToast('全部配对完成！', 'success');
        addStars(3);
        showConfetti();
      }, 600);
    }
  } else {
    playWrongSound();
    el.classList.add('wrong');
    otherEl.classList.add('wrong');
    showToast('再试试看～', 'error');
    setTimeout(() => {
      el.classList.remove('wrong');
      otherEl.classList.remove('wrong');
    }, 500);
  }
  letterMatchSelected = null;
  // remove .selected from all
  document.querySelectorAll('#letterMatchGrid .match-card.selected').forEach(s => s.classList.remove('selected'));
}

function startLetterOrder(){
  const startIdx = randInt(0, LETTERS.length - 6);
  const targets = LETTERS.slice(startIdx, startIdx + 5);
  letterOrderData = targets.map(L => L.upper);
  letterOrderSlots = new Array(targets.length).fill(null);
  const bank = shuffle(letterOrderData.slice());
  const area = document.getElementById('letterGameArea');
  area.innerHTML = `
    <div style="text-align:center;margin-bottom:10px;color:#666;font-size:14px">点击字母按 A-Z 顺序填入槽位</div>
    <div class="order-slots" id="letterOrderSlots"></div>
    <div class="order-bank" id="letterOrderBank"></div>
    <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center">
      <button class="btn ghost" id="resetOrder">重置</button>
      <button class="btn" id="checkOrder">检查答案</button>
    </div>`;
  renderLetterOrder(bank);
}
function renderLetterOrder(bank){
  const slotsEl = document.getElementById('letterOrderSlots');
  slotsEl.innerHTML = letterOrderSlots.map((v,i) =>
    `<div class="order-slot ${v?'filled':''}" data-slot="${i}">${v||''}</div>`
  ).join('');
  const bankEl = document.getElementById('letterOrderBank');
  bankEl.innerHTML = bank.map((c,i) =>
    `<button class="order-piece" data-bank="${c}" data-bi="${i}" ${letterOrderSlots.includes(c)?'disabled':''}>${c}</button>`
  ).join('');
  bankEl.querySelectorAll('.order-piece').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      const letter = b.dataset.bank;
      // find first empty slot
      const idx = letterOrderSlots.indexOf(null);
      if(idx === -1) return;
      letterOrderSlots[idx] = letter;
      // remove from bank (mark disabled)
      b.disabled = true;
      renderLetterOrder(bank);
    });
  });
  // click slot to remove
  slotsEl.querySelectorAll('.order-slot').forEach(s => {
    s.addEventListener('click', () => {
      const i = parseInt(s.dataset.slot, 10);
      if(letterOrderSlots[i]){
        letterOrderSlots[i] = null;
        renderLetterOrder(bank);
        playClickSound();
      }
    });
  });
  document.getElementById('resetOrder').onclick = () => {
    playClickSound();
    startLetterOrder();
  };
  document.getElementById('checkOrder').onclick = () => {
    checkLetterOrder();
  };
}
function checkLetterOrder(){
  if(letterOrderSlots.includes(null)){
    showToast('请先把字母填满所有槽位～', 'error');
    return;
  }
  const correct = letterOrderSlots.every((v,i) => v === letterOrderData[i]);
  if(correct){
    playCorrectSound();
    addStars(3);
    showToast('完美排序！+3⭐', 'success');
    speak('Perfect!', 'en-US');
    setTimeout(() => startLetterOrder(), 1800);
  } else {
    playWrongSound();
    showToast('再试试看～', 'error');
    speak('Try again!', 'en-US');
  }
}

function startLetterFind(){
  letterFindScore = 0;
  const L = pickRandom(LETTERS);
  letterFindTarget = L.upper;
  // build 3x3 grid with one target + 8 distractors
  const grid = [letterFindTarget];
  const distractors = shuffle(LETTERS.filter(x => x.upper !== letterFindTarget)).slice(0, 8);
  distractors.forEach(d => grid.push(d.upper));
  const shuffled = shuffle(grid);
  renderLetterFind(shuffled);
}
function renderLetterFind(grid){
  const area = document.getElementById('letterGameArea');
  area.innerHTML = `
    <div class="find-target">点击字母：<span class="target-letter">${letterFindTarget}</span>（已找 ${letterFindScore}）</div>
    <div class="find-grid" id="findGrid"></div>`;
  const fg = document.getElementById('findGrid');
  grid.forEach((ch, i) => {
    const div = document.createElement('div');
    div.className = 'find-cell';
    div.textContent = ch;
    div.dataset.ch = ch;
    div.setAttribute('aria-label', `字母 ${ch}`);
    div.addEventListener('click', () => {
      if(div.disabled) return;
      if(ch === letterFindTarget){
        div.classList.add('correct');
        div.disabled = true;
        letterFindScore += 1;
        playCorrectSound();
        addStars(1);
        showToast('找到了！+1⭐', 'success');
        speak(letterFindTarget, 'en-US');
        setTimeout(() => startLetterFind(), 1500);
      } else {
        div.classList.add('wrong');
        div.disabled = true;
        playWrongSound();
        showToast('再找找看～', 'error');
      }
    });
    fg.appendChild(div);
  });
}

    cards.push({ id: 'cn_' + w.en, kind: 'cn', display: w.cn, match: w.en });
  });
  wordMatchData = shuffle(cards);
  wordMatchSelected = null;
  wordMatchScore = 0;
  renderWordMatch();

function renderWordMatch(){
  const area = document.getElementById('wordGameArea');
  area.innerHTML = `
    <div style="text-align:center;margin-bottom:10px;color:#666;font-size:14px">点击英文和中文配对（已配对 ${wordMatchScore} / 8）</div>
    <div class="match-grid" id="wordMatchGrid"></div>`;
  const grid = document.getElementById('wordMatchGrid');
  wordMatchData.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'match-card';
    div.textContent = c.display;
    div.dataset.idx = idx;
    div.setAttribute('aria-label', `${c.kind === 'en' ? '英文' : '中文'} ${c.display}`);
    div.addEventListener('click', () => handleWordMatchClick(idx));

  });
}
function handleWordMatchClick(idx){
  playClickSound();
  const card = wordMatchData[idx];
  if(card.matched) return;
  const el = document.querySelector(`#wordMatchGrid .match-card[data-idx="${idx}"]`);
  if(wordMatchSelected === null){
    wordMatchSelected = idx;
    el.classList.add('selected');
    return;
  }
  if(wordMatchSelected === idx){
    el.classList.remove('selected');
    wordMatchSelected = null;
    return;
  }
  const other = wordMatchData[wordMatchSelected];
  const otherEl = document.querySelector(`#wordMatchGrid .match-card[data-idx="${wordMatchSelected}"]`);
  const isMatch =
    (card.kind !== other.kind) && (card.match === other.display);
  if(isMatch){
    card.matched = true;
    other.matched = true;
    el.classList.add('matched');
    otherEl.classList.add('matched');
    el.disabled = true; otherEl.disabled = true;
    wordMatchScore += 1;
    playCorrectSound();
    addStars(1);
    showToast('配对成功！+1⭐', 'success');
    speak('Great!', 'en-US');
    if(wordMatchScore >= 8){
      setTimeout(() => {
        showToast('全部配对完成！', 'success');
        addStars(3);
        showConfetti();
      }, 600);
    }
  } else {
    playWrongSound();
    el.classList.add('wrong');
    otherEl.classList.remove('selected');
    showToast('再试试看～', 'error');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
  wordMatchSelected = null;
  document.querySelectorAll('#wordMatchGrid .match-card.selected').forEach(s => s.classList.remove('selected'));
}

function renderSpell(){
  const w = spellCurrentWord;
  const letters = w.en.toLowerCase().split('');
  // count max usage per letter
  const maxCount = {};
  letters.forEach(c => { maxCount[c] = (maxCount[c] || 0) + 1; });
  const usedCount = {};
  spellInputLetters.forEach(c => { usedCount[c] = (usedCount[c] || 0) + 1; });

  const area = document.getElementById('wordGameArea');
  const slotsHtml = spellInputLetters.map((c,i) =>
    `<div class="spell-slot filled">${c}</div>`
  ).join('') + Array(letters.length - spellInputLetters.length).fill('<div class="spell-slot"></div>').join('');

  const keys = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const keysHtml = keys.map(k => {
    const used = usedCount[k] || 0;
    const max = maxCount[k] || 0;
    const disabled = used >= max;
    return `<button class="spell-key" data-k="${k}" ${disabled?'disabled':''}>${k}</button>`;
  }).join('');

  area.innerHTML = `
    <div class="spell-display">
      <span class="emoji" aria-hidden="true">${w.emoji}</span>
      <div class="cn">${w.cn}</div>
    </div>
    <div class="spell-slots">${slotsHtml}</div>
    <div class="spell-keyboard">${keysHtml}<button class="spell-key spell-clear" data-clear>清除</button></div>`;

  area.querySelectorAll('.spell-key[data-k]').forEach(k => {
    k.addEventListener('click', () => {
      playClickSound();
      const c = k.dataset.k;
      handleSpellKey(c);
    });
  });
  area.querySelector('[data-clear]').addEventListener('click', () => {
    playClickSound();
    clearSpellInput();
  });
}
function handleSpellKey(ch){
  if(spellInputLetters.length >= spellCurrentWord.en.length) return;
  spellInputLetters.push(ch);
  renderSpell();
  // check if complete
  if(spellInputLetters.length === spellCurrentWord.en.length){
    const got = spellInputLetters.join('');
    if(got === spellCurrentWord.en.toLowerCase()){
      playCorrectSound();
      addStars(2);
      showToast('拼写正确！+2⭐', 'success');
      speak(spellCurrentWord.en, 'en-US');
      setTimeout(() => initSpellGame(), 1800);
    } else {
      playWrongSound();
      showToast('再试试看～', 'error');
      speak('Try again!', 'en-US');
    }
  }
}
function clearSpellInput(){
  spellInputLetters = [];
  renderSpell();
}

let sentenceOrderTarget = null;
let sentenceOrderSlots = [];
function initSentenceOrder(){
  // pick a sentence with ≥3 words from current scene
  const sents = SENTENCE_SCENES[currentSentenceScene].sentences;
  const candidates = sents.filter(s => s.en.split(/\s+/).length >= 3);
  if(candidates.length === 0){
    // fallback: take any
    sentenceOrderTarget = pickRandom(sents);
  } else {
    sentenceOrderTarget = pickRandom(candidates);
  }
  const words = sentenceOrderTarget.en.replace(/[.!?]/g,'').split(/\s+/).filter(Boolean);
  sentenceOrderSlots = new Array(words.length).fill(null);
  const bank = shuffle(words.slice());
  renderSentenceOrder(bank, words);
  setTimeout(() => speak(sentenceOrderTarget.en, 'en-US'), 500);
}
function renderSentenceOrder(bank, correctWords){
  const area = document.getElementById('sentenceGameArea');
  area.innerHTML = `
    <div style="text-align:center;margin-bottom:10px;color:#666;font-size:14px">点击单词按正确顺序排成句子</div>
    <div style="background:#fff;border-radius:var(--r-card);padding:14px;margin-bottom:10px;text-align:center">
      <div style="font-size:14px;color:#666">中文：${sentenceOrderTarget.cn}</div>
      <button class="icon-btn" id="replaySentOrder" style="margin-top:6px" aria-label="再听一遍">🔊</button>
    </div>
    <div class="order-slots" id="sentOrderSlots"></div>
    <div class="order-bank" id="sentOrderBank"></div>
    <div style="text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center">

      <button class="btn blue" id="checkSentOrder">检查</button>
    </div>`;
  const slotsEl = document.getElementById('sentOrderSlots');
  slotsEl.innerHTML = sentenceOrderSlots.map((v,i) =>
    `<div class="order-slot ${v?'filled':''}" data-slot="${i}">${v||''}</div>`
  ).join('');
  const bankEl = document.getElementById('sentOrderBank');
  bankEl.innerHTML = bank.map((c,i) =>
    `<button class="order-piece" data-bank="${c}" data-bi="${i}" ${sentenceOrderSlots.includes(c)?'disabled':''}>${c}</button>`
  ).join('');
  bankEl.querySelectorAll('.order-piece').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      const word = b.dataset.bank;
      const idx = sentenceOrderSlots.indexOf(null);
      if(idx === -1) return;
      sentenceOrderSlots[idx] = word;
      renderSentenceOrder(bank, correctWords);
    });
  });
  slotsEl.querySelectorAll('.order-slot').forEach(s => {
    s.addEventListener('click', () => {
      const i = parseInt(s.dataset.slot, 10);
      if(sentenceOrderSlots[i]){
        sentenceOrderSlots[i] = null;
        renderSentenceOrder(bank, correctWords);
      }
    });
  });
  document.getElementById('replaySentOrder').onclick = () => speak(sentenceOrderTarget.en, 'en-US');
  document.getElementById('resetSentOrder').onclick = () => { playClickSound(); initSentenceOrder(); };
  document.getElementById('checkSentOrder').onclick = () => checkSentenceOrder(bank);
}
function checkSentenceOrder(bank){
  if(sentenceOrderSlots.includes(null)){
    showToast('请先把单词填满槽位～', 'error');
    return;
  }
  const targetWords = sentenceOrderTarget.en.replace(/[.!?]/g,'').split(/\s+/).filter(Boolean);
  const ok = sentenceOrderSlots.length === targetWords.length &&
             sentenceOrderSlots.every((w,i) => w === targetWords[i]);
  if(ok){
    playCorrectSound();
    addStars(3);
    showToast('完美排序！+3⭐', 'success');
    speak(sentenceOrderTarget.en, 'en-US');
    setTimeout(() => initSentenceOrder(), 1800);
  } else {
    playWrongSound();
    showToast('再试试看～', 'error');
    speak('Try again!', 'en-US');
  }
}

function startMemoryGame(theme){
  const words = shuffle(WORD_THEMES[theme].words).slice(0, 8);
  const cards = [];
  words.forEach(w => {
    cards.push({ id: 'en_' + w.en, kind: 'en', display: w.en, match: w.cn, theme });
    cards.push({ id: 'cn_' + w.en, kind: 'cn', display: w.cn, match: w.en, theme });
  });
  memoryCards = shuffle(cards);
  memoryFlipped = [];
  memoryMatched = 0;
  memoryTotal = 8;
  memoryLock = false;
  renderMemory();
  // theme picker
  const area = document.getElementById('gameArea');
  const themePicker = `
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap">
      ${Object.keys(WORD_THEMES).filter(k => ['animals','food','body','colors'].includes(k)).map(k =>
        `<button class="tab-pill red ${k===theme?'active':''}" data-memory-theme="${k}">${WORD_THEMES[k].name}</button>`
      ).join('')}
    </div>`;
  area.insertAdjacentHTML('afterbegin', themePicker);
  area.querySelectorAll('[data-memory-theme]').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      startMemoryGame(b.dataset.memoryTheme);
    });
  });
}
function renderMemory(){
  const area = document.getElementById('gameArea');
  // remove theme picker first card if exists
  const oldPicker = area.querySelector('[data-memory-picker]');
  // we built picker outside renderMemory to avoid duplication; render grid below existing picker
  const gridWrap = area.querySelector('#memoryGridWrap') || (() => {
    const w = document.createElement('div');
    w.id = 'memoryGridWrap';
    area.appendChild(w);
    return w;
  })();
  gridWrap.innerHTML = `<div class="memory-grid" id="memoryGrid"></div>`;
  const grid = document.getElementById('memoryGrid');
  memoryCards.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'memory-card';
    div.dataset.idx = idx;
    div.setAttribute('aria-label', '未翻开的卡片');
    div.innerHTML = `
      <div class="face back">❓</div>
      <div class="face front">${c.display}</div>`;
    div.addEventListener('click', () => flipMemoryCard(idx));
    grid.appendChild(div);
  });
}
function flipMemoryCard(idx){
  if(memoryLock) return;
  if(memoryFlipped.includes(idx)) return;
  if(memoryCards[idx].matched) return;
  playClickSound();
  memoryFlipped.push(idx);
  const el = document.querySelector(`#memoryGrid .memory-card[data-idx="${idx}"]`);
  el.classList.add('flipped');
  if(memoryFlipped.length === 2){
    memoryLock = true;
    const [a,b] = memoryFlipped;
    const ca = memoryCards[a], cb = memoryCards[b];
    const isMatch = ca.kind !== cb.kind && ca.match === cb.display;
    setTimeout(() => {
      if(isMatch){
        memoryCards[a].matched = true;
        memoryCards[b].matched = true;
        el.classList.add('matched');
        document.querySelector(`#memoryGrid .memory-card[data-idx="${a}"]`).classList.add('matched');
        memoryMatched += 1;
        playCorrectSound();
        addStars(1);
        if(memoryMatched >= memoryTotal){
          setTimeout(() => {
            showToast('全部配对完成！+5⭐', 'success');
            addStars(5);
            speak('Amazing!', 'en-US');
            showConfetti();
            // restart after a moment
            setTimeout(() => startMemoryGame(memoryCards[0].theme), 2500);
          }, 500);
        }
      } else {
        playWrongSound();
        document.querySelector(`#memoryGrid .memory-card[data-idx="${a}"]`).classList.remove('flipped');
        document.querySelector(`#memoryGrid .memory-card[data-idx="${b}"]`).classList.remove('flipped');
        showToast('再翻翻看～', 'error');
      }
      memoryFlipped = [];
      memoryLock = false;
    }, 700);
  }
}

function clearWhackTimers(){
  if(whackTimer){ clearInterval(whackTimer); whackTimer = null; }
  if(whackSpawnTimer){ clearTimeout(whackSpawnTimer); whackSpawnTimer = null; }
  whackActive = false;
}
function startWhackGame(){
  clearWhackTimers();
  whackPoints = 0;
  whackTimeLeft = 30;
  // pick target word from current word theme
  whackTargetWord = pickRandom(WORD_THEMES[currentWordTheme].words).en;
  whackActive = true;
  renderWhack();
  whackTimer = setInterval(() => {
    whackTimeLeft -= 1;
    if(whackTimeLeft <= 0){
      endWhackGame();
      return;
    }
    updateWhackHUD();
  }, 1000);
  scheduleWhackSpawn();
}
function renderWhack(){
  const area = document.getElementById('gameArea');
  let holes = '';
  for(let i=0;i<9;i++) holes += `<div class="whack-hole" data-hole="${i}"><div class="mole"></div></div>`;
  area.innerHTML = `
    <div class="whack-hud">
      <div><div class="label">目标</div><div class="value" id="whackTarget">${whackTargetWord}</div></div>
      <div><div class="label">分数</div><div class="value" id="whackScore">${whackPoints}</div></div>
      <div><div class="label">时间</div><div class="value" id="whackTime">${whackTimeLeft}s</div></div>
    </div>
    <div class="whack-area">
      <div class="whack-target-word">点击出现的：<strong>${whackTargetWord}</strong></div>
      <div class="whack-grid">${holes}</div>
    </div>`;
  area.querySelectorAll('.whack-hole').forEach(h => {
    h.addEventListener('click', () => handleWhackClick(parseInt(h.dataset.hole, 10)));
  });
}
function updateWhackHUD(){
  const t = document.getElementById('whackTime');
  const s = document.getElementById('whackScore');
  if(t) t.textContent = whackTimeLeft + 's';
  if(s) s.textContent = whackPoints;
}
function scheduleWhackSpawn(){
  if(!whackActive) return;
  const delay = randInt(800, 1500);
  whackSpawnTimer = setTimeout(() => {
    if(!whackActive) return;
    spawnWhack();
    scheduleWhackSpawn();
  }, delay);
}
function spawnWhack(){
  if(!whackActive) return;
  // pick a hole
  const holes = document.querySelectorAll('.whack-hole');
  if(holes.length === 0) return;
  const idx = randInt(0, 8);
  const hole = holes[idx];
  // pick a word: 50% target, 50% distractor
  let word;
  if(Math.random() < 0.4) word = whackTargetWord;
  else {
    const pool = [];
    Object.keys(WORD_THEMES).forEach(k => WORD_THEMES[k].words.forEach(w => pool.push(w)));
    word = pickRandom(pool.filter(w => w.en !== whackTargetWord)).en;
  }
  hole.querySelector('.mole').textContent = word;
  hole.dataset.word = word;
  hole.classList.add('show');
  hole.classList.remove('correct-hit','wrong-hit');
  setTimeout(() => {
    if(!whackActive) return;
    hole.classList.remove('show');
    hole.dataset.word = '';
  }, 1500);
}
function handleWhackClick(holeIdx){
  if(!whackActive) return;
  playClickSound();
  const holes = document.querySelectorAll('.whack-hole');
  const hole = holes[holeIdx];
  if(!hole || !hole.classList.contains('show')) return;
  const word = hole.dataset.word;
  if(word === whackTargetWord){
    whackPoints += 10;
    hole.classList.add('correct-hit');
    playCorrectSound();
    addStars(1);
  } else {
    whackPoints = Math.max(0, whackPoints - 5);
    hole.classList.add('wrong-hit');
    playWrongSound();
  }
  hole.classList.remove('show');
  hole.dataset.word = '';
  updateWhackHUD();
}
function endWhackGame(){
  clearWhackTimers();
  const area = document.getElementById('gameArea');
  const earned = Math.floor(whackPoints / 10);
  if(earned > 0) addStars(earned);
  const stars = whackPoints >= 200 ? '⭐⭐⭐⭐⭐' : whackPoints >= 150 ? '⭐⭐⭐⭐' : whackPoints >= 100 ? '⭐⭐⭐' : whackPoints >= 50 ? '⭐⭐' : '⭐';
  area.innerHTML = `
    <div class="game-over">
      <h3>🎉 时间到！</h3>
      <div class="score">${whackPoints} 分</div>
      <div class="stars-row">${stars}</div>
      <div class="stats">
        <span>+${earned} ⭐</span>
      </div>
      <button class="btn red" id="restartWhack">再来一次</button>
    </div>`;
  area.querySelector('#restartWhack').addEventListener('click', () => { playClickSound(); startWhackGame(); });
  if(whackPoints >= 150) showConfetti();
}

function clearChallengeTimers(){
  if(challengeTimer){ clearInterval(challengeTimer); challengeTimer = null; }
  challengeActive = false;
}
function startChallenge(){
  clearChallengeTimers();
  challengePoints = 0;
  challengeTotal = 0;
  challengeCorrect = 0;
  challengeTimeLeft = 60;
  challengeActive = true;
  generateChallengeQuestion();
  challengeTimer = setInterval(() => {
    challengeTimeLeft -= 1;
    if(challengeTimeLeft <= 0){
      endChallenge();
      return;
    }
    const t = document.getElementById('challengeTimer');
    if(t){
      t.textContent = challengeTimeLeft;
      if(challengeTimeLeft <= 10) t.classList.add('urgent');
    }
  }, 1000);
}
function generateChallengeQuestion(){
  // random from words or sentences; show en → pick cn, or show cn → pick en
  const useSentence = Math.random() < 0.5;
  let pool, target, options;
  if(useSentence){
    pool = [];
    Object.keys(SENTENCE_SCENES).forEach(k => SENTENCE_SCENES[k].sentences.forEach(s => pool.push(s)));
    target = pickRandom(pool);
    const distractors = shuffle(pool.filter(s => s.en !== target.en)).slice(0, 3);
    options = shuffle([target, ...distractors]);
    renderChallengeSentence(target, options);
  } else {
    pool = [];
    Object.keys(WORD_THEMES).forEach(k => WORD_THEMES[k].words.forEach(w => pool.push(w)));
    target = pickRandom(pool);
    const distractors = shuffle(pool.filter(w => w.en !== target.en)).slice(0, 3);
    options = shuffle([target, ...distractors]);
    renderChallengeWord(target, options);
  }
}
function renderChallengeWord(target, options){
  const area = document.getElementById('gameArea');
  const direction = Math.random() < 0.5; // true: en→cn, false: cn→en
  area.innerHTML = `
    <div class="challenge-hud">
      <div><div class="label">时间</div><div class="timer" id="challengeTimer">${challengeTimeLeft}</div></div>
      <div><div class="label">分数</div><div class="value" style="font-size:24px;color:var(--c-orange-1)" id="challengePoints">${challengePoints}</div></div>
      <div><div class="label">已答</div><div class="value" style="font-size:20px">${challengeTotal}</div></div>
    </div>
    <div style="text-align:center;background:#fff;padding:18px;border-radius:var(--r-card);margin-bottom:12px;box-shadow:var(--shadow-card)">
      <div style="font-size:14px;color:#666">${direction?'看英文选中文':'看中文选英文'}</div>
      <div style="font-size:32px;font-weight:700;color:var(--c-orange-1);margin-top:6px">
        ${direction ? target.en : target.cn}
      </div>
    </div>
    <div class="listen-options" id="chOpts"></div>`;
  const optsEl = document.getElementById('chOpts');
  options.forEach(o => {
    const div = document.createElement('button');
    div.className = 'listen-option';
    div.textContent = direction ? o.cn : o.en;
    const correctKey = direction ? o.cn : o.en;
    const targetKey = direction ? target.cn : target.en;
    div.dataset.correct = (correctKey === targetKey) ? '1' : '0';
    div.addEventListener('click', () => {
      if(div.disabled) return;
      const correct = div.dataset.correct === '1';
      challengeTotal += 1;
      div.classList.add(correct ? 'correct' : 'wrong');
      div.disabled = true;
      if(correct){
        challengeCorrect += 1;
        challengePoints += 10;
        playCorrectSound();
      } else {
        playWrongSound();
      }
      // disable other options
      optsEl.querySelectorAll('.listen-option').forEach(x => x.disabled = true);
      // update score
      const cp = document.getElementById('challengePoints');
      if(cp) cp.textContent = challengePoints;
      setTimeout(() => {
        if(!challengeActive) return;
        generateChallengeQuestion();
      }, 900);
    });
    optsEl.appendChild(div);
  });
}
function renderChallengeSentence(target, options){
  // similar but with sentences
  const area = document.getElementById('gameArea');
  const direction = Math.random() < 0.5;
  area.innerHTML = `
    <div class="challenge-hud">
      <div><div class="label">时间</div><div class="timer" id="challengeTimer">${challengeTimeLeft}</div></div>
      <div><div class="label">分数</div><div class="value" style="font-size:24px;color:var(--c-orange-1)" id="challengePoints">${challengePoints}</div></div>
      <div><div class="label">已答</div><div class="value" style="font-size:20px">${challengeTotal}</div></div>
    </div>
    <div style="text-align:center;background:#fff;padding:18px;border-radius:var(--r-card);margin-bottom:12px;box-shadow:var(--shadow-card)">
      <div style="font-size:14px;color:#666">${direction?'看英文选中文':'看中文选英文'}</div>
      <div style="font-size:24px;font-weight:700;color:var(--c-blue-1);margin-top:6px">
        ${direction ? target.en : target.cn}
      </div>
    </div>
    <div class="listen-options" id="chOpts"></div>`;
  const optsEl = document.getElementById('chOpts');
  options.forEach(o => {
    const div = document.createElement('button');
    div.className = 'listen-option';
    div.style.fontSize = '15px';
    div.textContent = direction ? o.cn : o.en;
    const correctKey = direction ? o.cn : o.en;
    const targetKey = direction ? target.cn : target.en;
    div.dataset.correct = (correctKey === targetKey) ? '1' : '0';
    div.addEventListener('click', () => {
      if(div.disabled) return;
      const correct = div.dataset.correct === '1';
      challengeTotal += 1;
      div.classList.add(correct ? 'correct' : 'wrong');
      div.disabled = true;
      if(correct){
        challengeCorrect += 1;
        challengePoints += 10;
        playCorrectSound();
      } else {
        playWrongSound();
      }
      optsEl.querySelectorAll('.listen-option').forEach(x => x.disabled = true);
      const cp = document.getElementById('challengePoints');
      if(cp) cp.textContent = challengePoints;
      setTimeout(() => {
        if(!challengeActive) return;
        generateChallengeQuestion();
      }, 900);
    });
    optsEl.appendChild(div);
  });
}
function endChallenge(){
  clearChallengeTimers();
  const accuracy = challengeTotal > 0 ? Math.round(challengeCorrect / challengeTotal * 100) : 0;
  const stars = accuracy >= 90 ? '⭐⭐⭐⭐⭐' : accuracy >= 75 ? '⭐⭐⭐⭐' : accuracy >= 50 ? '⭐⭐⭐' : accuracy >= 25 ? '⭐⭐' : '⭐';
  const bonus = Math.floor(challengePoints / 50);
  if(bonus > 0) addStars(bonus);
  const area = document.getElementById('gameArea');
  area.innerHTML = `
    <div class="challenge-result">
      <h3>🎉 挑战结束！</h3>
      <div class="big-score">${challengePoints} 分</div>
      <div class="stars-row">${stars}</div>
      <div class="stats">
        <span>已答 ${challengeTotal}</span>
        <span>正确 ${challengeCorrect}</span>
        <span>正确率 ${accuracy}%</span>
      </div>
      <div style="color:var(--c-orange-1);font-weight:600;margin:8px 0">+${bonus} ⭐</div>
      <button class="btn orange" id="restartChallenge">再来一次</button>
    </div>`;
  area.querySelector('#restartChallenge').addEventListener('click', () => { playClickSound(); startChallenge(); });
  if(accuracy >= 75) showConfetti();
}

/* ==========================================================
   Initialization
   ========================================================== */
function init(){
  // load persisted state
  totalStars = parseInt(_lsGet('engStars', '0'), 10) || 0;
  try {
    learnedWords = JSON.parse(_lsGet('engLearnedWords', '[]'));
    if(!Array.isArray(learnedWords)) learnedWords = [];
  } catch(e){
    learnedWords = [];
  }
  document.getElementById('totalStars').textContent = totalStars;

  // module nav
  document.querySelectorAll('.module-btn').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      switchModule(b.dataset.module);
    });
  });

  // letter sub-games
  document.querySelectorAll('[data-letter-game]').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      switchLetterGame(b.dataset.letterGame);
    });
  });
  // word sub-games
  document.querySelectorAll('[data-word-game]').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      switchWordGame(b.dataset.wordGame);
    });
  });
  // sentence sub-games
  document.querySelectorAll('[data-sentence-game]').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      switchSentenceGame(b.dataset.sentenceGame);
    });
  });
  // listen type
  document.querySelectorAll('[data-listen-type]').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      switchListenType(b.dataset.listenType);
    });
  });
  // game type
  document.querySelectorAll('[data-game-type]').forEach(b => {
    b.addEventListener('click', () => {
      playClickSound();
      switchGame(b.dataset.gameType);
    });
  });

  // initial renders
  renderLetterGrid();
  showLetter(0);
  startLetterMatch();
  renderWordThemeTabs();
  renderWordGrid();
  startWordMatch();
  renderSentenceSceneTabs();
  renderSentenceList();
  initSentenceOrder();
  generateListenQuestion();
  document.getElementById('listenArea').dataset.init = '1';
  startMemoryGame('animals');
  document.getElementById('gameArea').dataset.init = '1';

  // tap anywhere to lazily init audio context (mobile autoplay policy)
  const unlockAudio = () => {
    _getAudioCtx();
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('click', unlockAudio);
  };
  document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
  document.addEventListener('click', unlockAudio, { once: true });
}

// Boot
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
